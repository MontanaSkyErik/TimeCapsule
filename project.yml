# Generates TimeCapsule.xcodeproj. Run:  xcodegen
name: TimeCapsule
options:
  bundleIdPrefix: com.montanaeriksson
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  TimeCapsule:
    type: application
    platform: iOS
    sources:
      - path: TimeCapsule
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.montanaeriksson.timecapsule
        PRODUCT_NAME: TimeCapsule
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TimeCapsule/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YXFFXVWZHM
schemes:
  TimeCapsule:
    build:
      targets:
        TimeCapsule: all
    run:
      config: Debug
